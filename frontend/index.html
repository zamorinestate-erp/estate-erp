<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamorin Cafe ERP</title>
  <meta name="theme-color" content="#101a30" />
  <meta name="description" content="Zamorin Cafe ERP — secure multi-location café management" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/zamorin-app-icon-vector.svg" />
  <link rel="apple-touch-icon" href="/src/assets/zamorin-app-icon-1024.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="/src/styles/tokens.css?v=2.0.1" />
  <link rel="stylesheet" href="/src/styles/zamorin.css?v=2.0.1" />
  <script>
    window.ZAMORIN_API_BASE_URL =
      (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? ('http://' + window.location.hostname + ':4000/api/v1')
        : 'https://zamorin-cafe-erp-backend.onrender.com/api/v1';
  </script>
</head>
<body>
  <div id="app" class="auth-screen">
    <div class="login-screen" style="--auth-background:url(https://picsum.photos/seed/zamorin-fallback-01/3840/2160)">
      <div class="login-card glass-dark">
        <div class="login-brand">
          <img src="/src/assets/zamorin-logo-horizontal.svg" alt="Zamorin Estate Pvt. Ltd." class="login-brand-logo" />
          <div class="login-sub">Cafe ERP — sign in to continue</div>
        </div>
        <h1 class="auth-login-title">Login</h1>
        <form id="login-form">
          <label class="login-label" for="login-organisation">Organisation ID</label>
          <input id="login-organisation" class="text-input" type="text" autocomplete="organization" placeholder="Organisation ID" value="ZAMORIN" />

          <label class="login-label" for="login-email" style="margin-top:12px;">Email</label>
          <input id="login-email" class="text-input" type="email" autocomplete="username" placeholder="Email ID" value="master@example.com" />

          <label class="login-label" for="login-password" style="margin-top:12px;">Password</label>
          <div style="position:relative;">
            <input id="login-password" class="text-input" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" id="toggle-password-btn" class="login-eye" tabindex="-1">Show</button>
          </div>

          <div class="flex justify-between items-center" style="margin:14px 0 18px;">
            <label class="login-remember">
              <input type="checkbox" id="login-remember" checked />
              Remember me
            </label>
            <button type="button" id="login-forgot-password" class="login-forgot-link">Forgot password?</button>
          </div>

          <button id="login-submit-btn" type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Login</button>
        </form>
      </div>
    </div>
  </div>
  <div id="toast-root"></div>

  <script type="module" src="/src/js/main.js?v=2.0.1"></script>
</body>
</html>
