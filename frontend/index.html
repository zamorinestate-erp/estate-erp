<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamorin Cafe ERP</title>
  <meta name="theme-color" content="#101a30" />
  <meta name="description" content="Zamorin Cafe ERP — secure multi-location café management system" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/zamorin-app-icon-vector.svg" />
  <link rel="apple-touch-icon" href="/src/assets/zamorin-app-icon-1024.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <!-- Design system: tokens → layout → components → theme overrides -->
  <link rel="stylesheet" href="/src/styles/tokens.css?v=3.0.4" />
  <link rel="stylesheet" href="/src/styles/layout.css?v=3.0.4" />
  <link rel="stylesheet" href="/src/styles/components.css?v=3.0.4" />
  <link rel="stylesheet" href="/src/styles/zamorin.css?v=3.0.4" />
  <script>
    (function() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) { r.unregister(); }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var n of names) caches.delete(n);
          });
        }
        var savedTheme = localStorage.getItem('zamorin-theme') || 'paper';
        document.documentElement.dataset.theme = savedTheme;
        var savedFontSize = localStorage.getItem('zamorin-font-size') || 'standard';
        document.documentElement.dataset.fontSize = savedFontSize;
      } catch (e) {}
    })();
    window.ZAMORIN_API_BASE_URL =
      (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? ('http://' + window.location.hostname + ':4000/api/v1')
        : 'https://zamorin-cafe-erp-backend.onrender.com/api/v1';
  </script>
</head>
<body>
  <div id="app" class="auth-screen"></div>
  <div id="toast-root"></div>

  <script type="module" src="/src/js/main.js?v=3.0.4"></script>
</body>
</html>
