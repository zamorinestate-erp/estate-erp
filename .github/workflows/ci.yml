name: Zamorin Cafe ERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: System Validation & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        working-directory: ./backend
        run: npm run check

      - name: Run Cross-System Specification Suite
        working-directory: ./backend
        run: node test/crossSystemSpecificationFinal.test.js

      - name: Run Document Storage Durability Suite
        working-directory: ./backend
        run: node test/documentStorageDurability.test.js

      - name: Run OWASP ASVS 5.0 Compliance Suite
        working-directory: ./backend
        run: node test/asvsCompliance.test.js

      - name: Run Stage 10 Post-Release Operations Suite
        working-directory: ./backend
        run: node test/stage10PostReleaseOperations.test.js

      - name: Verify Frontend Router Imports
        run: node frontend/verifyRouterImports.mjs

      - name: Run Master System Verification Engine
        run: node scripts/master_system_verification.mjs

      - name: Run Deployment Readiness Check
        run: node scripts/check_deploy_readiness.mjs
