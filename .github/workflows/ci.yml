name: Zamorin Cafe ERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-web:
    name: Web & Backend Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        working-directory: ./backend
        run: npm run check

      - name: Run Canonical Regression Suite
        run: npm test

      - name: Verify Frontend Router Imports
        run: node frontend/verifyRouterImports.mjs

      - name: Run Master System Verification Engine
        run: node scripts/master_system_verification.mjs

      - name: Run Deployment Readiness Check
        run: node scripts/check_deploy_readiness.mjs

  android:
    name: Android Native Client CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Run Android Native Unit Tests
        working-directory: ./android
        run: ./gradlew test

      - name: Run Android Lint
        working-directory: ./android
        run: ./gradlew lintDebug

      - name: Compile Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

  windows:
    name: Windows Native Client CI
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore windows/ZamorinCafeERP.sln

      - name: Run Windows Native Unit Tests
        run: dotnet test windows/ZamorinCafeERP.Tests -c Release

      - name: Publish Windows Native Shell
        run: dotnet publish windows/ZamorinCafeERP -c Release

