name: Zamorin Cafe ERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: System Validation & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        working-directory: ./backend
        run: npm run check

      - name: Run Backend Regression Test Suite
        working-directory: ./backend
        run: npm test

      - name: Verify Frontend Router Imports
        run: node frontend/verifyRouterImports.mjs

      - name: Run Master System Verification Engine
        run: node scripts/master_system_verification.mjs
